
    <div class="control-row">
      <label>Animation mode
        <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-driveMode">?<span class="hint" role="tooltip" id="hint-driveMode">Scroll tracks scroll position. Continuous flips through the sentence on its own clock. Static Scroll keeps the page from scrolling — instead, scroll (mouse wheel/trackpad) while hovering the text (or an element elsewhere on the page tagged <code>data-rolodex-hover="demoText"</code>) to flip through the words directly.</span></span>
      </label>
      <select id="driveModeSelect">
        <option value="scroll" selected>Scroll</option>
        <option value="continuous">Continuous</option>
        <option value="hover">Static Scroll (hover)</option>
      </select>
    </div>

    <div class="control-row" data-hover-only>
      <label><span class="label-text">Scroll speed <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-hoverScrollDistance">?<span class="hint" role="tooltip" id="hint-hoverScrollDistance">Wheel/trackpad distance needed to flip through the whole sentence while hovering. Lower is faster.</span></span></span><span id="hoverScrollDistanceVal" class="value"></span></label>
      <input id="hoverScrollDistanceRange" type="range" min="100" max="2000" step="50" value="1000" />
    </div>

    <div class="control-row" data-scroll-only>
      <label><span class="label-text"><input id="loopScrollCheckbox" type="checkbox" /><span>Loop around</span></span>
        <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-loopScroll">?<span class="hint" role="tooltip" id="hint-loopScroll">Makes the word list circular: scrolling/wheeling past the last word flips straight on into the first (and past the first, back into the last) instead of stopping there. In Scroll mode this only goes as far as there's page left to scroll; try Static Scroll (hover) to wheel through it indefinitely.</span></span>
      </label>
    </div>

    <div class="control-row" data-scroll-only>
      <label><span class="label-text"><input id="loopCheckbox" type="checkbox" /><span>Play when idle</span></span>
        <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-loopIdle">?<span class="hint" role="tooltip" id="hint-loopIdle">Once scroll/hover input goes idle, keep flipping through the sentence on its own (using the flip interval/duration/rollback speed below) instead of just holding on the last word until input resumes. Independent of "Loop past the end" above - this is about what happens once input stops, not while it's still coming in.</span></span>
      </label>
    </div>

    <div class="control-row" data-continuous-only>
      <label><span class="label-text">Flip interval <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-interval">?<span class="hint" role="tooltip" id="hint-interval">How long each word holds before flipping to the next.</span></span></span><span id="intervalVal" class="value"></span></label>
      <input id="intervalRange" type="range" min="200" max="4000" step="100" value="1400" />
    </div>

    <div class="control-row" data-continuous-only>
      <label><span class="label-text">Flip duration <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-flipDuration">?<span class="hint" role="tooltip" id="hint-flipDuration">How long the flip motion itself takes between two words.</span></span></span><span id="flipDurationVal" class="value"></span></label>
      <input id="flipDurationRange" type="range" min="100" max="1500" step="50" value="450" />
    </div>

    <div class="control-row" data-continuous-only>
      <label><span class="label-text">Rollback speed <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-rollbackSpeed">?<span class="hint" role="tooltip" id="hint-rollbackSpeed">Once the last word is reached, how long it takes to spin straight back to the first word. Has no effect when "Loop past the end" is on - the list is already circular, so the last word just flips forward into the first instead of rewinding.</span></span></span><span id="rollbackSpeedVal" class="value"></span></label>
      <input id="rollbackSpeedRange" type="range" min="200" max="4000" step="100" value="900" />
    </div>

    <div class="control-row">
      <label>Profile
        <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-profile">?<span class="hint" role="tooltip" id="hint-profile">Quick presets for the flip style, flip width, and perspective below. Adjusting any control afterward just tweaks that preset.</span></span>
      </label>
      <select id="profileSelect">
        <option value="split-flap" selected>Split-Flap</option>
        <option value="single-card">Single Card</option>
      </select>
    </div>
    <div class="control-row">
      <label>Font</label>
      <select id="fontSelect">
        <option value="'IBM Plex Mono', monospace" selected>IBM Plex Mono</option>
        <option value="'Bebas Neue', sans-serif">Bebas Neue</option>
        <option value="'Archivo Black', sans-serif">Archivo Black</option>
        <option value="'Space Grotesk', sans-serif">Space Grotesk</option>
        <option value="'Playfair Display', serif">Playfair Display (serif)</option>
      </select>
    </div>
    <div class="control-row">
      <label>Text</label>
      <input id="textInput" type="text" value="Rolodex flips through words one by one" />
    </div>
    <div class="control-row">
      <label>Flip style
        <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-flipStyle">?<span class="hint" role="tooltip" id="hint-flipStyle">Split-flap: the card is cut in half by a hinge — the top flips away first, then the bottom flips in, like a real flip clock. Single-card: the whole word rotates as one card with the next word on its back.</span></span>
      </label>
      <select id="modeSelect">
        <option value="split-flap" selected>Split-flap (top &amp; bottom flaps)</option>
        <option value="single-card">Single-card (whole word flips)</option>
      </select>
    </div>
    <div class="control-row" data-scroll-only>
      <label><span class="label-text">Flip width <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-flipWidth">?<span class="hint" role="tooltip" id="hint-flipWidth">How much of each word's scroll segment is spent mid-flip vs. holding on the fully-formed word.</span></span></span><span id="flipWidthVal" class="value"></span></label>
      <input id="flipWidthRange" type="range" min="10" max="95" step="1" value="55" />
    </div>
    <div class="control-row" data-scroll-only>
      <label><span class="label-text">Catch-up speed <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-snapStrength">?<span class="hint" role="tooltip" id="hint-snapStrength">How fast the display catches up to scroll/hover position - every frame it closes this fraction of the remaining gap. Higher snaps almost instantly; lower lags behind and settles more slowly, most visible right after a fast scroll or a big jump in a custom <code>pushProgress()</code> value.</span></span></span><span id="snapStrengthVal" class="value"></span></label>
      <input id="snapStrengthRange" type="range" min="0.02" max="1" step="0.01" value="0.4" />
    </div>
    <div class="control-row">
      <label><span class="label-text">Perspective <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-perspective">?<span class="hint" role="tooltip" id="hint-perspective">3D depth of the flip. Lower values exaggerate the foreshortening as a flap turns edge-on.</span></span></span><span id="perspectiveVal" class="value"></span></label>
      <input id="perspectiveRange" type="range" min="300" max="2400" step="20" value="900" />
    </div>
    <div class="control-row">
      <label><span class="label-text">Shading <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-shading">?<span class="hint" role="tooltip" id="hint-shading">How much a flap darkens as it turns edge-on, simulating light falloff.</span></span></span><span id="shadingVal" class="value"></span></label>
      <input id="shadingRange" type="range" min="0" max="1" step="0.01" value="0.55" />
    </div>
