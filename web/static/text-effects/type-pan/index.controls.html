
    <div class="control-row">
      <label>Animation mode
        <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-driveMode">?<span class="hint" role="tooltip" id="hint-driveMode">Scroll types from real page scroll position. Continuous types and erases the line on its own clock. Static Scroll keeps the page from scrolling — instead, scroll (mouse wheel/trackpad) while hovering the text (or an element elsewhere on the page tagged <code>data-type-pan-hover="demoText"</code>) to type it out directly.</span></span>
      </label>
      <select id="driveModeSelect">
        <option value="scroll" selected>Scroll</option>
        <option value="continuous">Continuous</option>
        <option value="hover">Static Scroll (hover)</option>
      </select>
    </div>

    <div class="control-row" data-hover-only>
      <label><span class="label-text">Scroll speed <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-sensitivity">?<span class="hint" role="tooltip" id="hint-sensitivity">Multiplier applied to wheel input while hovering. Higher is faster.</span></span></span><span id="sensitivityVal" class="value"></span></label>
      <input id="sensitivityRange" type="range" min="0.2" max="5" step="0.1" value="1" />
    </div>

    <div class="control-row" data-continuous-only>
      <label><span class="label-text">Type duration <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-typeDuration">?<span class="hint" role="tooltip" id="hint-typeDuration">How long it takes to type the whole line.</span></span></span><span id="typeDurationVal" class="value"></span></label>
      <input id="typeDurationRange" type="range" min="500" max="6000" step="100" value="2200" />
    </div>

    <div class="control-row" data-continuous-only>
      <label><span class="label-text">Hold duration <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-holdDuration">?<span class="hint" role="tooltip" id="hint-holdDuration">How long the fully-typed line holds before erasing.</span></span></span><span id="holdDurationVal" class="value"></span></label>
      <input id="holdDurationRange" type="range" min="0" max="4000" step="100" value="1000" />
    </div>

    <div class="control-row" data-continuous-only>
      <label><span class="label-text">Rollback speed <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-rollbackSpeed">?<span class="hint" role="tooltip" id="hint-rollbackSpeed">How long it takes to erase back to empty before typing starts again.</span></span></span><span id="rollbackSpeedVal" class="value"></span></label>
      <input id="rollbackSpeedRange" type="range" min="100" max="3000" step="100" value="700" />
    </div>

    <div class="control-row">
      <label>Font <span id="fontLabel" class="value"></span></label>
      <select id="fontSelect">
        <option value="'Archivo Black', sans-serif" selected>Archivo Black</option>
        <option value="'Space Grotesk', sans-serif">Space Grotesk</option>
        <option value="'IBM Plex Mono', monospace">IBM Plex Mono</option>
        <option value="'Courier Prime', monospace">Courier Prime</option>
        <option value="'Playfair Display', serif">Playfair Display (serif)</option>
        <option value="Georgia, serif">Georgia</option>
        <option value="'Courier New', monospace">Courier New (monospace)</option>
      </select>
    </div>

    <div class="control-row">
      <label>Text</label>
      <input id="textInput" type="text" value="Scroll to reveal the whole headline" />
    </div>

    <div class="control-row">
      <label>Font size <span id="sizeVal" class="value"></span></label>
      <input id="sizeRange" type="range" min="24" max="140" step="2" value="72" />
    </div>

    <div class="control-row">
      <label><span class="label-text">Pan pin position <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-pan">?<span class="hint" role="tooltip" id="hint-pan">Where the caret pins horizontally in the element once the line overflows it — the caret always sits right after the last typed character, and new characters reveal to its right as you scroll.</span></span></span><span id="panVal" class="value"></span></label>
      <input id="panRange" type="range" min="0.15" max="0.85" step="0.02" value="0.65" />
    </div>

    <div class="control-row">
      <label><span class="label-text">Pan smoothing <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-lag">?<span class="hint" role="tooltip" id="hint-lag">How quickly the element catches up to the caret. Lower = a softer, trailing pan; higher = an instant, snappy one.</span></span></span><span id="lagVal" class="value"></span></label>
      <input id="lagRange" type="range" min="0.02" max="1" step="0.02" value="0.18" />
    </div>

    <div class="control-row" data-scroll-only>
      <label>Reverse scroll behavior
        <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-erase">?<span class="hint" role="tooltip" id="hint-erase">On: scrolling back erases already-typed characters, like undoing the typing. Off: typed text is kept permanently and reverse scroll just rewinds the camera across it.</span></span>
      </label>
      <button id="eraseButton" class="toggle-button" type="button" aria-pressed="true">
        Erasing on scroll back
      </button>
    </div>

    <div class="control-row">
      <label>Blinking cursor</label>
      <button id="cursorButton" class="toggle-button" type="button" aria-pressed="true">
        Cursor blinking on
      </button>
    </div>

    <div class="control-row" data-hover-only>
      <button id="resetButton" class="toggle-button" type="button">
        ↺ Reset scroll
      </button>
    </div>
