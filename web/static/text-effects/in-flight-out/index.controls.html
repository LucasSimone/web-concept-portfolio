        <option value="'Space Grotesk', sans-serif">Space Grotesk</option>

    <div class="control-row">
      <label>Text</label>

      <label>Path
        <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-path">?<span class="hint" role="tooltip" id="hint-path">Linear: every letter enters from below and exits above. Random: each letter flies in from — and out to — its own random point off any edge of the screen.</span></span>

      <select id="pathSelect">

        <option value="random">Random (any edge → any edge)</option>
      </select>

    <div class="control-row">
      <label><span class="label-text">Scatter <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-scatter">?<span class="hint" role="tooltip" id="hint-scatter">How far characters travel away from their final positions.</span></span></span><span id="scatterVal" class="value"></span></label>
      <input id="scatterRange" type="range" min="0.4" max="1.8" step="0.05" value="1" />
    </div>
    <div class="control-row">
      <label><span class="label-text">Max distance <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-maxDistance">?<span class="hint" role="tooltip" id="hint-maxDistance">Caps how far off-screen a letter's flight path can carry it, as a percent of the viewport diagonal — keeps scatter from flinging letters absurdly far.</span></span></span><span id="maxDistanceVal" class="value"></span></label>
      <input id="maxDistanceRange" type="range" min="20" max="200" step="5" value="140" />
    </div>
    <div class="control-row">
      <label><span class="label-text">Rotation chance <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-rotation">?<span class="hint" role="tooltip" id="hint-rotation">Both the chance a letter rotates at all and how far it rotates (as a share of the max angle below). Near 0: few letters, small angles. Near 1: most letters, near the max angle.</span></span></span><span id="rotationVal" class="value"></span></label>
      <input id="rotationRange" type="range" min="0" max="1" step="0.01" value="0.4" />
    </div>
    <div class="control-row">
      <label>Max rotation angle <span id="maxAngleVal" class="value"></span></label>
      <input id="maxAngleRange" type="range" min="0" max="90" step="1" value="60" />

    <div class="control-row">
      <label>Entry <span id="entryVal" class="value"></span></label>
      <input id="entryRange" type="range" min="0" max="100" step="1" value="48" />
    </div>
    <div class="control-row">
      <label>Hangtime <span id="hangVal" class="value"></span></label>
      <input id="hangRange" type="range" min="0" max="100" step="1" value="10" />
    </div>
    <div class="control-row">
      <label><span class="label-text">Exit <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-exit">?<span class="hint" role="tooltip" id="hint-exit">Entry, hangtime, and exit always add up to 100% of the scroll range — adjusting one rebalances the other two.</span></span></span><span id="exitVal" class="value"></span></label>
      <input id="exitRange" type="range" min="0" max="100" step="1" value="42" />
