
    <div class="control-row">
      <label>Grid size <span id="cellVal" class="value"></span></label>
      <input type="range" id="cellRange" min="4" max="80" step="2" value="16" />
      <div class="hint">Spacing between grid points, in px.</div>
    </div>

    <div class="control-row">
      <label>Radius <span id="radiusVal" class="value"></span></label>
      <input type="range" id="radiusRange" min="60" max="500" step="10" value="90" />
      <div class="hint">How far from the cursor the pull reaches.</div>
    </div>

    <div class="control-row">
      <label>Strength <span id="strengthVal" class="value"></span></label>
      <input type="range" id="strengthRange" min="10" max="200" step="5" value="45" />
      <div class="hint">Maximum distance a grid point gets pulled, in px.</div>
    </div>

    <div class="control-row">
      <label>Trail <span id="easeVal" class="value"></span></label>
      <input type="range" id="easeRange" min="0.03" max="0.5" step="0.01" value="0.18" />
      <div class="hint">How quickly the pull point catches up to the cursor. Lower feels heavier.</div>
    </div>

    <div class="control-row">
      <button id="modeToggle" type="button" class="toggle-button" aria-pressed="false">View: Grid</button>
      <div class="hint">Grid draws the mesh lines; dots shows only the vertices.</div>
    </div>
