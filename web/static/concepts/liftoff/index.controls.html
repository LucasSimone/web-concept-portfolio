
    <div class="control-row">
      <label>Profile
        <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-profile">?<span class="hint" role="tooltip" id="hint-profile">Quick presets for the sliders below. Adjusting any slider afterward just tweaks that preset.</span></span>
      </label>
      <select id="profileSelect">
        <option value="classic" selected>Classic</option>
        <option value="rocket">Rocket Launch</option>
        <option value="drone">Drone Hover</option>
        <option value="afterburner">Afterburner</option>
        <option value="hovermist">Hover Mist</option>
        <option value="homepage">Homepage</option>
      </select>
    </div>

    <div class="control-row">
      <label class="control-checkbox">
        <input type="checkbox" id="shadowAtRestCheckbox" checked />
        Shadow at rest
        <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-shadowAtRest">?<span class="hint" role="tooltip" id="hint-shadowAtRest">Shows the dark contact shadow beneath the card while it's resting on the page. Off removes it entirely, independent of the dashes above.</span></span>
      </label>
    </div>

    <div class="control-row">
      <label for="shadowColorInput">Shadow color</label>
      <input type="color" id="shadowColorInput" class="t-swatch" value="#000000" aria-label="Shadow color" />
    </div>

    <div class="control-row">
      <label><span class="label-text">Dwell <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-dwell">?<span class="hint" role="tooltip" id="hint-dwell">How long the pointer has to stay over the card before it lifts off. Leaving before this elapses cancels with no visible motion.</span></span></span><span id="dwellVal" class="value"></span></label>
      <input id="dwellRange" type="range" min="300" max="3000" step="50" value="1500" />
    </div>

    <div class="control-row">
      <label><span class="label-text">Rise smoothing <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-riseSmoothing">?<span class="hint" role="tooltip" id="hint-riseSmoothing">Time-constant of the ease toward fully lifted (or back down). Higher lags and settles more slowly; lower snaps closer to instantly.</span></span></span><span id="riseSmoothingVal" class="value"></span></label>
      <input id="riseSmoothingRange" type="range" min="80" max="500" step="10" value="220" />
    </div>

    <div class="control-row">
      <label><span class="label-text">Lift height <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-lift">?<span class="hint" role="tooltip" id="hint-lift">How far the card rises off the page at full liftoff.</span></span></span><span id="liftVal" class="value"></span></label>
      <input id="liftRange" type="range" min="4" max="60" step="1" value="22" />
    </div>

    <div class="control-row">
      <label><span class="label-text">Drift X <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-driftX">?<span class="hint" role="tooltip" id="hint-driftX">Ambient horizontal drift once lifted.</span></span></span><span id="driftXVal" class="value"></span></label>
      <input id="driftXRange" type="range" min="0" max="24" step="1" value="7" />
    </div>

    <div class="control-row">
      <label><span class="label-text">Drift Y <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-driftY">?<span class="hint" role="tooltip" id="hint-driftY">Extra ambient vertical bob layered on top of the lift height once airborne.</span></span></span><span id="driftYVal" class="value"></span></label>
      <input id="driftYRange" type="range" min="0" max="24" step="1" value="5" />
    </div>

    <div class="control-row">
      <label><span class="label-text">Tilt <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-tilt">?<span class="hint" role="tooltip" id="hint-tilt">Ambient rotation once lifted.</span></span></span><span id="tiltVal" class="value"></span></label>
      <input id="tiltRange" type="range" min="0" max="6" step="0.1" value="1.6" />
    </div>

    <div class="control-row">
      <label><span class="label-text">Scale <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-scale">?<span class="hint" role="tooltip" id="hint-scale">How much the card grows at full liftoff.</span></span></span><span id="scaleVal" class="value"></span></label>
      <input id="scaleRange" type="range" min="1" max="1.12" step="0.005" value="1.035" />
    </div>

    <div class="control-row">
      <label class="control-checkbox">
        <input type="checkbox" id="glowCheckbox" checked />
        Dashes
        <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-glow">?<span class="hint" role="tooltip" id="hint-glow">Turns the falling dashes on or off. Off, the card just floats and hovers with nothing beneath it - the controls below grey out since they only affect the dashes.</span></span>
      </label>
    </div>

    <div class="control-row dash-control">
      <label for="dashColorInput">Dash color</label>
      <input type="color" id="dashColorInput" class="t-swatch" value="#000000" aria-label="Dash color" />
    </div>

    <div class="control-row dash-control">
      <label><span class="label-text">Columns <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-thrustColumns">?<span class="hint" role="tooltip" id="hint-thrustColumns">How many evenly-spaced dash columns make up the thrust. Each column's own dashes are still random and disjointed.</span></span></span><span id="thrustColumnsVal" class="value"></span></label>
      <input id="thrustColumnsRange" type="range" min="3" max="16" step="1" value="11" />
    </div>

    <div class="control-row dash-control">
      <label><span class="label-text">Line thickness <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-lineThickness">?<span class="hint" role="tooltip" id="hint-lineThickness">Width of each individual dash.</span></span></span><span id="lineThicknessVal" class="value"></span></label>
      <input id="lineThicknessRange" type="range" min="1" max="6" step="0.5" value="2" />
    </div>

    <div class="control-row dash-control">
      <label><span class="label-text">Thrust height <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-thrustHeight">?<span class="hint" role="tooltip" id="hint-thrustHeight">How tall the thrust reaches at its peak - a normal distribution across the whole width, so the center column comes closest to this height and columns toward the edges are shorter.</span></span></span><span id="thrustHeightVal" class="value"></span></label>
      <input id="thrustHeightRange" type="range" min="10" max="120" step="2" value="54" />
    </div>

    <div class="control-row dash-control">
      <label><span class="label-text">Speed <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-thrustSpeed">?<span class="hint" role="tooltip" id="hint-thrustSpeed">Multiplier on how fast each dash falls and fades, and on how quickly the next one spawns.</span></span></span><span id="thrustSpeedVal" class="value"></span></label>
      <input id="thrustSpeedRange" type="range" min="0.3" max="3" step="0.1" value="1" />
    </div>

    <div class="control-row dash-control">
      <label><span class="label-text">Line length min <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-lineLengthMin">?<span class="hint" role="tooltip" id="hint-lineLengthMin">Shortest a randomly-spawned dash can be. Each dash picks a random length between this and the max below.</span></span></span><span id="lineLengthMinVal" class="value"></span></label>
      <input id="lineLengthMinRange" type="range" min="2" max="40" step="1" value="6" />
    </div>

    <div class="control-row dash-control">
      <label><span class="label-text">Line length max <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-lineLengthMax">?<span class="hint" role="tooltip" id="hint-lineLengthMax">Longest a randomly-spawned dash can be.</span></span></span><span id="lineLengthMaxVal" class="value"></span></label>
      <input id="lineLengthMaxRange" type="range" min="2" max="60" step="1" value="16" />
    </div>

    <div class="control-row dash-control">
      <label><span class="label-text">Spacing min <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-spacingMin">?<span class="hint" role="tooltip" id="hint-spacingMin">Shortest random gap before a column spawns its next dash. Each pause is random between this and the max below.</span></span></span><span id="spacingMinVal" class="value"></span></label>
      <input id="spacingMinRange" type="range" min="0" max="60" step="1" value="4" />
    </div>

    <div class="control-row dash-control">
      <label><span class="label-text">Spacing max <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-spacingMax">?<span class="hint" role="tooltip" id="hint-spacingMax">Longest random gap before a column spawns its next dash.</span></span></span><span id="spacingMaxVal" class="value"></span></label>
      <input id="spacingMaxRange" type="range" min="0" max="100" step="1" value="14" />
    </div>

    <div class="control-row dash-control">
      <label><span class="label-text">Min fall duration <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-minFallDuration">?<span class="hint" role="tooltip" id="hint-minFallDuration">Floor on how fast a single dash's fall/fade can play out, regardless of speed. Short columns near the edges otherwise finish so fast they read as a flicker instead of a fall - raising this slows just those down.</span></span></span><span id="minFallDurationVal" class="value"></span></label>
      <input id="minFallDurationRange" type="range" min="100" max="1000" step="10" value="750" />
    </div>
