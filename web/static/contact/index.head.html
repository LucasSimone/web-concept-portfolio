  <title>Contact — Web Concept Portfolio</title>
  <style>
    .contact-hero {
      padding: 8vh 6vw 4vh;
      max-width: 560px;
    }
    .contact-hero h1 {
      font-size: clamp(28px, 5vw, 48px);
      margin: 0 0 12px;
    }
    .contact-hero p {
      font-size: 15px;
      line-height: 1.6;
      opacity: 0.75;
    }
    .contact-form {
      padding: 0 6vw 8vh;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .contact-form label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #000;
      background: #fff;
      color: #000;
      font: inherit;
      font-size: 14px;
    }
    .contact-form input:focus,
    .contact-form textarea:focus {
      outline: 2px solid #000;
      outline-offset: 2px;
    }
    .contact-form textarea {
      resize: vertical;
      min-height: 140px;
    }
    .contact-form button {
      align-self: flex-start;
    }
    /* Honeypot: hidden from sighted users and off the tab order, but still
       present in the DOM for bots that fill every field indiscriminately. */
    .contact-form .hp-field {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
    .contact-status {
      font-size: 13px;
      min-height: 1.4em;
    }
    .contact-status[data-state="ok"] { opacity: 0.75; }
    .contact-status[data-state="error"] { color: #b00000; }
  </style>
