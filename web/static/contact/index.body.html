
  <section class="form-intro">
    <h1>Get in touch</h1>
    <p>
      Need a site built, hosted, or kept up to date? Say what you're after
      and I'll reply. Questions about the effects on this site are welcome
      too.
    </p>
    <p>
      Found a bug in one of these effects — here or on your own site?
      <a href="/bug-report/index.html">Report it</a> instead.
    </p>
  </section>

  <form class="site-form" data-contact-form="inquiry"
        data-success="Thanks — I'll get back to you soon." novalidate>
    <div>
      <label for="topic">What do you need</label>
      <select id="topic" name="topic">
        <option value="website">A website built</option>
        <option value="hosting">Hosting or deployment</option>
        <option value="content">Content management</option>
        <option value="changes">Changes to a site I already have</option>
        <option value="effects">Something from this lab</option>
        <option value="other" selected>Something else</option>
      </select>
    </div>
    <div>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" required />
    </div>
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required />
    </div>
    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>
    </div>
    <div class="hp-field" aria-hidden="true">
      <label for="hpField">Leave this field blank</label>
      <input id="hpField" name="hp_field" type="text" tabindex="-1" autocomplete="off" />
    </div>
    <button class="btn" type="submit">Send</button>
    <p class="form-status" role="status"></p>
  </form>

  <script src="/shared/contact-form.js"></script>
