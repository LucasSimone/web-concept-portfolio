
    <div class="control-row">
      <label>Profile
        <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-profile">?<span class="hint" role="tooltip" id="hint-profile">Quick presets for every control below, each a different feel for the same motion. Adjusting any control afterward just tweaks that preset.</span></span>
      </label>
      <select id="profileSelect">
        <option value="default" selected>Default</option>
        <option value="snappy">Snappy</option>
        <option value="floaty">Floaty</option>
        <option value="wide">Wide Reach</option>
        <option value="stacked">Tight Stack</option>
      </select>
    </div>

    <div class="control-row">
      <label><span class="label-text">Cards <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-cardCount">?<span class="hint" role="tooltip" id="hint-cardCount">How many cards are in the strip above. The first 7 keep their own labels; past that, extra cards are generic placeholders. Below 7, cards are hidden from the end rather than removed.</span></span></span><span id="cardCountVal" class="value"></span></label>
      <input id="cardCountRange" type="range" min="1" max="20" step="1" value="7" />
    </div>

    <div class="control-row">
      <label class="control-checkbox">
        <input type="checkbox" id="hoverFollowCheckbox" checked />
        Hover
        <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-hoverFollow">?<span class="hint" role="tooltip" id="hint-hoverFollow">Whether moving the pointer across the strip pulls the nearest card to focus. Off leaves wheel and drag as the only ways to move it, regardless of card count.</span></span>
      </label>
    </div>

    <div class="control-row">
      <label class="control-checkbox">
        <input type="checkbox" id="wheelEnabledCheckbox" checked />
        Wheel scroll
        <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-wheelEnabled">?<span class="hint" role="tooltip" id="hint-wheelEnabled">Whether scrolling over the strip moves it. Off leaves wheel events alone entirely, so the page scrolls straight through instead of the strip capturing it - drag and hover still work.</span></span>
      </label>
    </div>

    <div class="control-row">
      <label><span class="label-text">Card step <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-cardStep">?<span class="hint" role="tooltip" id="hint-cardStep">Pixels of wheel/drag input that move the focus by exactly one card. Lower reads as lighter and faster; higher takes more input to travel the same distance.</span></span></span><span id="cardStepVal" class="value"></span></label>
      <input id="cardStepRange" type="range" min="80" max="400" step="10" value="200" />
    </div>

    <div class="control-row">
      <label><span class="label-text">Min scale <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-minScale">?<span class="hint" role="tooltip" id="hint-minScale">The smallest a card ever shrinks to, arbitrarily far from focus.</span></span></span><span id="minScaleVal" class="value"></span></label>
      <input id="minScaleRange" type="range" min="0.1" max="0.9" step="0.02" value="0.42" />
    </div>

    <div class="control-row">
      <label><span class="label-text">Scale falloff <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-scaleDecay">?<span class="hint" role="tooltip" id="hint-scaleDecay">How fast a card shrinks per step of distance from focus. Higher makes neighbors drop away quickly; lower keeps the whole strip closer to full size.</span></span></span><span id="scaleDecayVal" class="value"></span></label>
      <input id="scaleDecayRange" type="range" min="0.2" max="1.6" step="0.05" value="0.75" />
    </div>

    <div class="control-row">
      <label><span class="label-text">Wheel sensitivity <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-wheelSensitivity">?<span class="hint" role="tooltip" id="hint-wheelSensitivity">Multiplier on raw wheel delta before it's converted to a card distance via Card step.</span></span></span><span id="wheelSensitivityVal" class="value"></span></label>
      <input id="wheelSensitivityRange" type="range" min="0.2" max="3" step="0.1" value="1" />
    </div>

    <div class="control-row">
      <label><span class="label-text">Max velocity <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-maxVelocity">?<span class="hint" role="tooltip" id="hint-maxVelocity">Ceiling on how much velocity (in cards per frame) a single wheel tick or drag frame can hand to the coast.</span></span></span><span id="maxVelocityVal" class="value"></span></label>
      <input id="maxVelocityRange" type="range" min="0.05" max="1.2" step="0.05" value="0.4" />
    </div>

    <div class="control-row">
      <label><span class="label-text">Friction <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-friction">?<span class="hint" role="tooltip" id="hint-friction">How much velocity decays each frame once input goes idle. Lower coasts longer before settling; higher stops almost immediately.</span></span></span><span id="frictionVal" class="value"></span></label>
      <input id="frictionRange" type="range" min="0.4" max="0.97" step="0.01" value="0.8" />
    </div>

    <div class="control-row">
      <label><span class="label-text">Snap strength <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-snapStrength">?<span class="hint" role="tooltip" id="hint-snapStrength">How hard the idle spring pulls toward the nearest card each frame. Higher snaps in tighter and faster; lower drifts more loosely before catching.</span></span></span><span id="snapStrengthVal" class="value"></span></label>
      <input id="snapStrengthRange" type="range" min="0.01" max="0.15" step="0.005" value="0.045" />
    </div>

    <div class="control-row">
      <label><span class="label-text">Wheel idle delay <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-wheelIdleDelay">?<span class="hint" role="tooltip" id="hint-wheelIdleDelay">Milliseconds of no wheel events before Sweep treats wheel input as having stopped and switches over to the idle coast/snap.</span></span></span><span id="wheelIdleDelayVal" class="value"></span></label>
      <input id="wheelIdleDelayRange" type="range" min="40" max="400" step="10" value="140" />
    </div>

    <div class="control-row">
      <label><span class="label-text">Drag threshold <span class="hint-toggle" tabindex="0" aria-label="More info" aria-describedby="hint-dragThreshold">?<span class="hint" role="tooltip" id="hint-dragThreshold">Pixels of pointer movement before a press counts as a drag rather than a click straight through to the card.</span></span></span><span id="dragThresholdVal" class="value"></span></label>
      <input id="dragThresholdRange" type="range" min="0" max="24" step="1" value="6" />
    </div>
